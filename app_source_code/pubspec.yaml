name: stock_advisory
description: "Fundamental Investment Assistant for Indian Equities - Flutter Native Mobile App"
publish_to: "none"
version: 0.3.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking & Serialization
  dio: ^5.4.3+1
  json_annotation: ^4.9.0

  # Offline Local Database
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Typography & Formatting
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Icons & UI Utilities
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
